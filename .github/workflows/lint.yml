name: Auto Linter
on:
  push:
    paths: "*.py"
jobs:
  code_linting:
    runs-on: ubuntu-latest
    steps:
      - name: checkout/clone the code
        uses: actions/checkout@v7
      - name: Install Linter
        run: pip install ruff
      - name: Check the files for linting
        run: ruff check .
        

       
